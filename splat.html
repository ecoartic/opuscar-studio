<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نمایشگر Gaussian Splat — Behrang Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<script type="importmap">
{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
 "@sparkjsdev/spark":"https://sparkjs.dev/releases/spark/2.4.0/spark.module.js",
 "iwer":"https://cdn.jsdelivr.net/npm/iwer@2.8.0/build/iwer.module.min.js",
 "@iwer/devui":"https://cdn.jsdelivr.net/npm/@iwer/devui@2.8.0/build/iwer-devui.module.min.js"}}
</script>
<style>
.xrhint{font-size:12px;color:var(--mut);margin:4px 0}
:root{--bg:#0e0f12;--panel:#17191e;--line:#2a2d35;--fg:#ececec;--mut:#9aa0ab;--acc:#e8b04b;}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Vazirmatn,system-ui,sans-serif}a{color:var(--acc)}
#view{position:fixed;inset:0}#view canvas{display:block;width:100%;height:100%}
#px{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;display:none;pointer-events:none}
.pan{position:fixed;top:56px;right:12px;width:min(300px,calc(100vw - 24px));max-height:calc(100vh - 70px);overflow:auto;background:rgba(23,25,30,.92);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:12px 14px;z-index:3;font-size:14px}
.pan h1{font-size:18px;margin:0 0 4px}.pan p{margin:0 0 8px;color:var(--mut);font-size:12.5px;line-height:1.6}
label{display:block;font-size:12.5px;color:var(--mut);margin:9px 0 3px}
input[type=text],select{width:100%;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:#101216;color:var(--fg);font:inherit;font-size:13px;direction:ltr}
input[type=range]{width:100%}
.btn{width:100%;margin-top:8px;padding:8px;border:0;border-radius:9px;background:var(--acc);color:#1a1300;font:inherit;font-weight:800;cursor:pointer}.btn.s{background:#26282d;color:var(--fg);font-weight:600}
.drop{border:1px dashed #3a3f4a;border-radius:9px;padding:10px;text-align:center;color:var(--mut);font-size:12.5px;margin-top:8px;cursor:pointer}
.msg{font-size:12.5px;color:var(--acc);min-height:1.4em;margin-top:6px}
.toggle{margin-top:6px;font-size:12.5px}
@media(max-width:700px){.pan{top:auto;bottom:8px;right:8px;left:8px;width:auto;max-height:42vh}.hide{top:auto;bottom:8px}}.hide{position:fixed;top:56px;right:12px;z-index:4;display:none}
</style>
<link rel="stylesheet" href="common.css?v=2">
</head>
<body class="full">
<div id="view"></div><canvas id="px"></canvas>
<button class="btn s hide" id="show" style="width:auto;padding:6px 12px">پنل</button>
<div class="pan" id="pan">
  <h1>نمایشگر Gaussian Splat</h1>
  <p>فایل .ply، .spz، .splat یا .ksplat خودتان (خروجی 3DGS، Nerfstudio، SHARP، World Labs و…) را اینجا ببینید؛ عادی یا pixel-art. فایل از مرورگر خارج نمی‌شود.</p>
  <div class="drop" id="drop">فایل را اینجا بکشید یا کلیک کنید<input type="file" id="file" accept=".ply,.spz,.splat,.ksplat" hidden></div>
  <label>یا آدرس فایل (URL)</label><input type="text" id="url" placeholder="https://…/scene.spz">
  <button class="btn" id="load">بارگذاری</button>
  <button class="btn s" id="sample">نمونه: پروانه (Spark)</button>
  <label>چرخش برای درست ایستادن</label>
  <select id="flip"><option value="x180">وارونه (معمول برای 3DGS)</option><option value="none">بدون چرخش</option><option value="x90">۹۰ درجه حول X</option></select>
  <label><input type="checkbox" id="pix"> حالت pixel-art</label>
  <label>اندازه‌ی پیکسل: <span id="psv">4</span></label><input type="range" id="ps" min="2" max="12" value="4">
  <label>تعداد سطح رنگ: <span id="lvv">6</span></label><input type="range" id="lv" min="2" max="16" value="6">
  <label><input type="checkbox" id="ol" checked> خط دور (outline)</label>
  <label>پس‌زمینه</label><select id="bg"><option value="#101216">تیره</option><option value="#e9e4d8">روشن</option><option value="#00b140">کروما سبز</option><option value="#0047bb">کروما آبی</option></select>
  <button class="btn s" id="shot">عکس از نما (PNG)</button>
  <button class="btn s" id="toSS">ویرایش همین splat در SuperSplat ↗</button>
  <label>نمایش در VR / AR (WebXR)</label>
  <select id="xrfit"><option value="table">روی میز: جلوی شما، حدود ۱٫۲ متر</option><option value="room">مقیاس واقعی ۱:۱ (محیط دور شما)</option></select>
  <label><input type="checkbox" id="emu"> شبیه‌ساز Quest 3 روی دسکتاپ (IWER)</label>
  <p class="xrhint" id="xrhint"></p>
  <button class="btn s" id="hidep">پنهان کردن پنل</button>
  <div class="msg" id="msg"></div>
  <p style="margin-top:8px">موتور: <a href="https://github.com/sparkjsdev/spark">Spark</a> روی three.js؛ حالت pixel از ایده‌ی <a href="https://github.com/cobanov/pixelart-gaussiansplat">pixelart-gaussiansplat</a>. <a href="library.html">← کتابخانه</a></p>
</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {SparkRenderer,SplatMesh} from '@sparkjsdev/spark';
import {VRButton} from 'three/addons/webxr/VRButton.js';
import {ARButton} from 'three/addons/webxr/ARButton.js';
const EMU=new URLSearchParams(location.search).has('emulate');
if(EMU){try{const {XRDevice,metaQuest3}=await import('iwer');const dev=new XRDevice(metaQuest3);dev.installRuntime({forceInstall:true});
 try{const {DevUI}=await import('@iwer/devui');new DevUI(dev);}catch(e){console.warn('devui',e);}}catch(e){console.warn('iwer',e);}}
const $=id=>document.getElementById(id),msg=t=>$('msg').textContent=t;
const view=$('view'),renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true,alpha:true});
renderer.xr.enabled=true;
renderer.setPixelRatio(Math.min(devicePixelRatio,2));view.appendChild(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(55,1,0.01,1000);camera.position.set(0,0,3);
scene.add(new SparkRenderer({renderer}));
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
let mesh=null;
function size(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',size);size();
function orient(m){m.quaternion.identity();const f=$('flip').value;if(f==='x180')m.rotation.x=Math.PI;else if(f==='x90')m.rotation.x=-Math.PI/2;}
let LAST_URL='https://sparkjs.dev/assets/splats/butterfly.spz';
async function show(opts,name){try{LAST_URL=opts.url||null;msg('در حال بارگذاری '+name+' …');if(mesh){scene.remove(mesh);mesh.dispose?.();}
 mesh=new SplatMesh(opts);orient(mesh);scene.add(mesh);await mesh.initialized;
 const box=mesh.getBoundingBox?mesh.getBoundingBox():null;
 if(box&&!box.isEmpty()){const c=box.getCenter(new THREE.Vector3()),s=box.getSize(new THREE.Vector3()).length();const wc=c.clone().applyQuaternion(mesh.quaternion);controls.target.copy(wc);camera.position.copy(wc).add(new THREE.Vector3(0,s*0.15,s*0.9));camera.near=s/1000;camera.far=s*50;camera.updateProjectionMatrix();}
 else{controls.target.set(0,0,0);camera.position.set(0,0,3);}
 msg(name+' بارگذاری شد.');}catch(e){msg('خطا: '+e.message);}}
$('toSS').onclick=()=>{if(LAST_URL)window.open('supersplat/?load='+encodeURIComponent(LAST_URL),'_blank');else{window.open('supersplat/','_blank');msg('فایل محلی را در SuperSplat هم روی صفحه بکشید (Drag & Drop).');}};
$('sample').onclick=()=>{$('flip').value='x180';show({url:'https://sparkjs.dev/assets/splats/butterfly.spz'},'پروانه');};
$('load').onclick=()=>{const u=$('url').value.trim();if(u)show({url:u},u.split('/').pop());};
$('drop').onclick=()=>$('file').click();
async function file(f){const b=new Uint8Array(await f.arrayBuffer());show({fileBytes:b,fileName:f.name},f.name);}
$('file').onchange=e=>e.target.files[0]&&file(e.target.files[0]);
['dragover','drop'].forEach(ev=>addEventListener(ev,e=>{e.preventDefault();if(ev==='drop'&&e.dataTransfer.files[0])file(e.dataTransfer.files[0]);}));
$('flip').onchange=()=>mesh&&orient(mesh);
$('ps').oninput=()=>$('psv').textContent=$('ps').value;$('lv').oninput=()=>$('lvv').textContent=$('lv').value;
$('bg').onchange=()=>scene.background=new THREE.Color($('bg').value);scene.background=new THREE.Color($('bg').value);
// ---- WebXR: VR (Quest/PCVR) + AR passthrough (Quest 3 / Android) ----
$('emu').checked=EMU;$('emu').onchange=()=>{const u=new URL(location.href);if($('emu').checked)u.searchParams.set('emulate','1');else u.searchParams.delete('emulate');location.href=u;};
const vrB=VRButton.createButton(renderer),arB=ARButton.createButton(renderer,{optionalFeatures:['local-floor','hit-test']});
[vrB,arB].forEach((b,i)=>{b.style.left=(i?'calc(50% + 8px)':'auto');b.style.right=(i?'auto':'calc(50% + 8px)');b.style.fontFamily='Vazirmatn,sans-serif';document.body.appendChild(b);});
let saved=null;
renderer.xr.addEventListener('sessionstart',()=>{const ar=renderer.xr.getSession().environmentBlendMode&&renderer.xr.getSession().environmentBlendMode!=='opaque';
 saved={bg:scene.background};if(ar)scene.background=null;
 if(mesh){saved.p=mesh.position.clone();saved.q=mesh.quaternion.clone();saved.s=mesh.scale.clone();
  const box=mesh.getBoundingBox?mesh.getBoundingBox():null;let size=1,c=new THREE.Vector3();
  if(box&&!box.isEmpty()){size=box.getSize(new THREE.Vector3()).length();c=box.getCenter(new THREE.Vector3()).applyQuaternion(mesh.quaternion);}
  if($('xrfit').value==='table'){const k=1.2/size;mesh.scale.setScalar(k);mesh.position.set(0,1.25,-1.3).sub(c.multiplyScalar(k));}
  else{mesh.scale.setScalar(1);mesh.position.set(0,1.6,0).sub(c);}}
 msg(ar?'جلسه‌ی AR (passthrough) شروع شد.':'جلسه‌ی VR شروع شد.');});
renderer.xr.addEventListener('sessionend',()=>{if(saved){scene.background=saved.bg;if(mesh&&saved.p){mesh.position.copy(saved.p);mesh.quaternion.copy(saved.q);mesh.scale.copy(saved.s);}}saved=null;msg('از XR خارج شدید.');});
(async()=>{const x=navigator.xr;let vr=false,ar=false;if(x){try{vr=await x.isSessionSupported('immersive-vr');ar=await x.isSessionSupported('immersive-ar');}catch(e){}}
 $('xrhint').textContent=vr||ar?('این مرورگر پشتیبانی می‌کند: '+[vr&&'VR',ar&&'AR'].filter(Boolean).join(' + ')+' — دکمه‌های پایین صفحه.'):'WebXR در این مرورگر نیست. روی Quest همین صفحه را در Meta Quest Browser باز کنید، روی PC از Quest Link/Steam Link با Chrome، یا تیک شبیه‌ساز را بزنید.';})();
$('hidep').onclick=()=>{$('pan').style.display='none';$('show').style.display='block';};$('show').onclick=()=>{$('pan').style.display='';$('show').style.display='none';};
// pixel-art post: downsample + posterize + outline on a small 2D canvas
const px=$('px'),pctx=px.getContext('2d',{willReadFrequently:true}),tmp=document.createElement('canvas'),tctx=tmp.getContext('2d',{willReadFrequently:true});
function pixel(){const p=+$('ps').value,w=Math.max(1,Math.floor(innerWidth/p)),h=Math.max(1,Math.floor(innerHeight/p));
 tmp.width=w;tmp.height=h;tctx.imageSmoothingEnabled=true;tctx.drawImage(renderer.domElement,0,0,w,h);
 const im=tctx.getImageData(0,0,w,h),d=im.data,L=+$('lv').value,st=255/(L-1),bg=new THREE.Color($('bg').value),br=bg.r*255,bgG=bg.g*255,bb=bg.b*255;
 const isBg=new Uint8Array(w*h);
 for(let i=0,j=0;i<d.length;i+=4,j++){isBg[j]=(Math.abs(d[i]-br)+Math.abs(d[i+1]-bgG)+Math.abs(d[i+2]-bb))<24?1:0;
  if(!isBg[j]){d[i]=Math.round(d[i]/st)*st;d[i+1]=Math.round(d[i+1]/st)*st;d[i+2]=Math.round(d[i+2]/st)*st;}}
 if($('ol').checked){for(let y=0;y<h;y++)for(let x=0;x<w;x++){const j=y*w+x;if(isBg[j])continue;
  if((x>0&&isBg[j-1])||(x<w-1&&isBg[j+1])||(y>0&&isBg[j-w])||(y<h-1&&isBg[j+w])){const i=j*4;d[i]*=.45;d[i+1]*=.45;d[i+2]*=.5;}}}
 tctx.putImageData(im,0,0);px.width=w;px.height=h;pctx.imageSmoothingEnabled=false;pctx.drawImage(tmp,0,0);}
$('shot').onclick=()=>{const c=$('pix').checked?px:renderer.domElement;c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='splat-view.png';a.click();});};
renderer.setAnimationLoop(()=>{const xr=renderer.xr.isPresenting;if(!xr)controls.update();renderer.render(scene,camera);const on=$('pix').checked&&!xr;px.style.display=on?'block':'none';if(on)pixel();});
</script>
<script src="site.js?v=8"></script>
</body>
</html>
