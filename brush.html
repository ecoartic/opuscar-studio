<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>آزمایشگاه قلم‌مو — Behrang Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0f12;--panel:#17191e;--line:#2a2d35;--fg:#ececec;--mut:#9aa0ab;--acc:#e8b04b;}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Vazirmatn,system-ui,sans-serif;line-height:1.7}a{color:var(--acc)}
header{padding:36px 20px 14px;text-align:center;background:radial-gradient(ellipse at top,#2a2214 0%,var(--bg) 70%)}
header h1{margin:0 0 6px;font-size:clamp(24px,4.5vw,38px);font-weight:800}header p{margin:0 auto;max-width:720px;color:var(--mut)}
.nav{margin-top:10px;font-size:14px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
main{max-width:1280px;margin:0 auto;padding:14px;display:grid;grid-template-columns:300px 1fr;gap:16px}
@media(max-width:820px){main{grid-template-columns:1fr}.stage{order:-1;position:static}}
.pan{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;align-self:start}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}
select,input[type=number],input[type=text]{width:100%;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:#101216;color:var(--fg);font:inherit}
input[type=range]{width:100%}
.pal{display:flex;gap:6px;flex-wrap:wrap}.pal button{border:1px solid var(--line);border-radius:8px;padding:3px;background:#101216;cursor:pointer;display:flex}.pal button.on{border-color:var(--acc)}.pal i{width:14px;height:22px;display:block}
.sw{display:flex;gap:6px;margin-top:6px}.sw input{width:36px;height:30px;border:0;padding:0;background:none}
.btn{width:100%;margin-top:10px;padding:10px;border:0;border-radius:10px;background:var(--acc);color:#1a1300;font:inherit;font-weight:800;cursor:pointer}
.btn.s{background:#26282d;color:var(--fg);font-weight:600}
.stage{background:#08090b;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;padding:10px;align-self:start;position:sticky;top:10px}
.stage canvas{max-width:100%;max-height:75vh;width:auto!important;height:auto!important;border-radius:6px}
.msg{font-size:13px;color:var(--mut);margin-top:8px;min-height:1.5em}
footer{border-top:1px solid var(--line);padding:20px 16px;text-align:center;color:var(--mut);font-size:13px}
</style>
<link rel="stylesheet" href="common.css?v=2">
</head>
<body>
<header>
  <h1>آزمایشگاه قلم‌مو</h1>
  <p>پس‌زمینه و loop دست‌ساز با قلم‌موی طبیعی (p5.brush) برای تیتراژ، برنامه‌ی علمی و LED wall. تنظیم کنید، بسازید و PNG یا ویدیو بگیرید.</p>
</header>
<main>
  <div class="pan">
    <label>اندازه</label>
    <select id="size"><option value="1920x1080">افقی 1920×1080</option><option value="1080x1920">عمودی 1080×1920</option><option value="1080x1080">مربع 1080×1080</option><option value="3840x1080">نوار LED 3840×1080</option></select>
    <label>ترکیب</label>
    <select id="mode"><option value="flow">جریان خطوط (flow lines)</option><option value="wash">لکه‌های آبرنگ</option><option value="mixed">ترکیبی</option><option value="hatch">هاشور هندسی</option></select>
    <label>قلم‌مو</label><select id="brush"></select>
    <label>میدان حرکت (vector field)</label>
    <select id="field"><option value="waves">waves</option><option value="seabed">seabed</option><option value="hand">hand</option><option value="diagonal">diagonal</option><option value="">بدون میدان</option></select>
    <label>پالت</label><div class="pal" id="pal"></div>
    <div class="sw" id="sw"></div>
    <label>پس‌زمینه</label><div class="sw"><input type="color" id="bg" value="#f3ecdd"></div>
    <label>تعداد ضربه‌ها: <span id="nv"></span></label><input type="range" id="n" min="20" max="600" value="180">
    <label>ضخامت: <span id="wv"></span></label><input type="range" id="w" min="0.3" max="4" step="0.1" value="1.4">
    <label>seed</label><input type="number" id="seed" value="7">
    <button class="btn" id="go">ساختن</button>
    <button class="btn s" id="rnd">seed تصادفی و ساختن</button>
    <button class="btn s" id="png">دانلود PNG</button>
    <label>ویدیوی کشیده شدن (WebM)</label>
    <select id="dur"><option value="6">۶ ثانیه</option><option value="10" selected>۱۰ ثانیه</option><option value="20">۲۰ ثانیه</option></select>
    <button class="btn s" id="rec">ضبط ویدیو</button>
    <div class="msg" id="msg"></div>
  </div>
  <div class="stage" id="stage"></div>
</main>
<footer>ساخته‌شده با <a href="https://github.com/acamposuribe/p5.brush">p5.brush</a> (نسخه‌ی standalone) از Alejandro Campos Uribe، مجوز MIT.</footer>
<script type="module">
import * as brush from 'https://cdn.jsdelivr.net/npm/p5.brush@3.0.0/dist/brush.esm.js';
const $=id=>document.getElementById(id);
const PALS={'کاغذ و جوهر':['#1f2a44','#b23a2e','#d9a441','#3f6e5a','#2b2b2b'],'آبی و طلا':['#0f2c4d','#2e6f9e','#8fb8d8','#d9a441','#f1d48a'],'گرم استودیو':['#3a1c14','#a3422b','#e07a3f','#f2b45a','#6b4a3a'],'سرد شب':['#0b1320','#1d3557','#457b9d','#a8dadc','#e63946'],'پاستیلی':['#e5989b','#b5838d','#6d6875','#ffcdb2','#9fc5e8'],'تک‌رنگ':['#111111','#333333','#555555','#777777','#999999']};
let pal=Object.values(PALS)[0].slice(),W=1920,H=1080,canvas;
function palUI(){$('pal').innerHTML=Object.entries(PALS).map(([k,v],i)=>`<button title="${k}" data-k="${k}">${v.map(c=>`<i style="background:${c}"></i>`).join('')}</button>`).join('');
 $('pal').querySelectorAll('button').forEach(b=>b.onclick=()=>{pal=PALS[b.dataset.k].slice();swUI();$('pal').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));draw();});
 $('pal').firstElementChild.classList.add('on');swUI();}
function swUI(){$('sw').innerHTML=pal.map((c,i)=>`<input type="color" value="${c}" data-i="${i}">`).join('');$('sw').querySelectorAll('input').forEach(x=>x.oninput=()=>{pal[+x.dataset.i]=x.value;});}
let rs=1;function seedR(s){rs=s>>>0||1;}function R(a=1,b){if(b===undefined){b=a;a=0;}rs^=rs<<13;rs^=rs>>>17;rs^=rs<<5;return a+((rs>>>0)/4294967296)*(b-a);}
function setup(){[W,H]=$('size').value.split('x').map(Number);$('stage').innerHTML='';
 brush.createCanvas(W,H,{parent:'#stage',pixelDensity:1});canvas=$('stage').querySelector('canvas');
 brush.scaleBrushes(Math.max(W,H)/600*1.2);}
function plan(){const n=+$('n').value,mode=$('mode').value,ops=[];seedR(+$('seed').value);
 for(let i=0;i<n;i++){const c=pal[Math.floor(R(pal.length))];const x=R(-W/2,W/2),y=R(-H/2,H/2);
  const m=mode==='mixed'?(R()<.25?'wash':'flow'):mode;
  if(m==='flow')ops.push({t:'flow',c,x,y,l:R(.15,.6)*Math.min(W,H),d:R(360)});
  else if(m==='wash')ops.push({t:'wash',c,x,y,r:R(.04,.16)*Math.min(W,H),o:R(40,120)});
  else ops.push({t:'hatch',c,x,y,s:R(.06,.2)*Math.min(W,H),d:R(180)});}
 return ops;}
function op(o){const w=+$('w').value,b=$('brush').value;
 if(o.t==='flow'){brush.noFill();brush.set(b,o.c,w);brush.flowLine(o.x,o.y,o.l,o.d);}
 else if(o.t==='wash'){brush.noStroke();brush.fill(o.c,o.o);brush.fillBleed(.35);brush.circle(o.x,o.y,o.r);brush.noFill();}
 else{brush.set(b,o.c,w);brush.hatch(R(6,14),o.d);brush.rect(o.x,o.y,o.s,o.s*R(.6,1.4));brush.noHatch();}}
function begin(){const f=$('field').value;if(f)brush.field(f);else brush.noField();brush.seed(+$('seed').value);brush.noiseSeed(+$('seed').value);}
function draw(){try{const ops=plan();brush.clear($('bg').value);begin();ops.forEach(op);brush.render();$('msg').textContent='';}catch(e){$('msg').textContent='خطا: '+e.message;}}
function init(){setup();try{const list=brush.box();$('brush').innerHTML=list.map(n=>`<option${n==='HB'?' selected':''}>${n}</option>`).join('');}catch(e){$('brush').innerHTML='<option>HB</option>';}draw();}
$('nv').textContent=$('n').value;$('wv').textContent=$('w').value;
$('n').oninput=()=>$('nv').textContent=$('n').value;$('w').oninput=()=>$('wv').textContent=$('w').value;
$('go').onclick=draw;$('rnd').onclick=()=>{$('seed').value=Math.floor(Math.random()*99999);draw();};
$('size').onchange=init;
$('png').onclick=()=>{draw();canvas.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`brush-${$('seed').value}.png`;a.click();});};
$('rec').onclick=async()=>{if(!window.MediaRecorder){$('msg').textContent='این مرورگر ضبط ویدیو را پشتیبانی نمی‌کند.';return;}
 const ops=plan(),sec=+$('dur').value,fps=30,frames=sec*fps,per=Math.max(1,Math.ceil(ops.length/(frames*0.85)));
 const st=canvas.captureStream(fps),mt=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';
 const rec=new MediaRecorder(st,{mimeType:mt,videoBitsPerSecond:12e6}),ch=[];rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
 rec.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(ch,{type:'video/webm'}));a.download=`brush-${$('seed').value}.webm`;a.click();$('msg').textContent='ویدیو آماده شد.';};
 brush.clear($('bg').value);begin();brush.render();rec.start();let i=0,f=0;$('msg').textContent='در حال ضبط…';
 await new Promise(res=>{const tick=()=>{for(let k=0;k<per&&i<ops.length;k++)op(ops[i++]);brush.render();if(++f>=frames){res();return;}requestAnimationFrame(tick);};tick();});
 rec.stop();};
palUI();init();
</script>
<script src="site.js?v=5"></script>
</body>
</html>
